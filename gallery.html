<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edition Rent — Generated Assets</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root{--black:#0a0a0a;--white:#f5f2ed;--gold:#c9a84c;--gray:#1a1a1a;--muted:#888;--border:rgba(201,168,76,0.2)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--black);color:var(--white);font-family:'DM Sans',sans-serif;font-weight:300;padding:60px 40px}
    header{max-width:1100px;margin:0 auto 48px}
    .eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
    h1{font-family:'Cormorant Garamond',serif;font-size:clamp(34px,5vw,56px);font-weight:300;letter-spacing:-.01em}
    h1 em{font-style:italic;color:var(--gold)}
    .sub{color:var(--muted);font-size:14px;margin-top:14px;max-width:620px;line-height:1.7}
    .grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
    .card{position:relative;background:var(--gray);border:1px solid var(--border);overflow:hidden;aspect-ratio:3/4}
    .card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}
    .card:hover img{transform:scale(1.05)}
    .card .meta{position:absolute;inset:auto 0 0 0;padding:20px;background:linear-gradient(to top,rgba(10,10,10,.92),transparent)}
    .card .name{font-family:'Cormorant Garamond',serif;font-size:20px}
    .card .file{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-top:4px}
    /* graceful state when an image hasn't been generated yet */
    .card img{background:var(--gray)}
    .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--muted);font-size:11px;letter-spacing:.15em;text-transform:uppercase;text-align:center;padding:20px}
    .placeholder span{font-family:'Cormorant Garamond',serif;font-size:34px;color:rgba(201,168,76,.25)}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:560px){.grid{grid-template-columns:1fr}body{padding:40px 20px}}
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">Edition Rent · Asset Preview</div>
    <h1>Generated <em>Fleet</em> Imagery</h1>
    <p class="sub">These images are produced by <strong>tools/generate-images.mjs</strong> via the kie.ai API and saved into <strong>/assets</strong>. The page only references local files — no API key is ever exposed to the browser. Run the generator, then refresh.</p>
  </header>

  <section class="grid" id="grid"></section>

  <script>
    // Mirror of tools/images.config.json (name + output_format) so the
    // gallery knows which files to show. Update if you add images.
    const IMAGES = [
      { name: 'hero',             ext: 'jpeg', label: 'Hero' },
      { name: 'fleet-lamborghini',ext: 'jpeg', label: 'Lamborghini' },
      { name: 'fleet-ferrari',    ext: 'jpeg', label: 'Ferrari' },
      { name: 'fleet-rollsroyce', ext: 'jpeg', label: 'Rolls-Royce' },
      { name: 'featured-bentley', ext: 'jpeg', label: 'Bentley' },
      { name: 'interior-detail',  ext: 'jpeg', label: 'Interior' },
      { name: 'about-showroom',   ext: 'jpeg', label: 'Showroom' },
      { name: 'about-keys',       ext: 'jpeg', label: 'Concierge' },
    ];

    const grid = document.getElementById('grid');
    for (const it of IMAGES) {
      const src = `assets/${it.name}.${it.ext}`;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img alt="${it.label}" src="${src}"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
        <div class="placeholder" style="display:none">
          <span>✦</span>${it.name}.${it.ext}<br>not generated yet
        </div>
        <div class="meta">
          <div class="name">${it.label}</div>
          <div class="file">assets/${it.name}.${it.ext}</div>
        </div>`;
      grid.appendChild(card);
    }
  </script>
</body>
</html>
